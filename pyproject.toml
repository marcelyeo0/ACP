[project]
name = "pca-segmentation-forecast"
version = "0.1.0"
description = "Segmentation de points de vente par ACP/CAH et prevision de distribution a 3 mois"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "matplotlib",
    "streamlit",
    "pydantic-settings",
    "python-dotenv",
    "joblib",
    "duckdb>=2.0.0",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "jupyter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pca_segmentation"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
